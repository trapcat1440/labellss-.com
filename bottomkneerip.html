<script>

let currentScene = 1;
const totalScenes = 3;

const backgrounds = {
1:"https://i.imghippo.com/files/ssvd2134Bc.png",
2:"https://i.imghippo.com/files/IjWf4184IhY.png",
3:"https://i.imghippo.com/files/DihE9567JyA.png",
};

function showScene(index){

    document.querySelectorAll(".slideshow-widget .scene").forEach(scene=>{
        scene.classList.remove("active");
    });

    const scene=document.getElementById("scene"+index);
    scene.style.backgroundImage=`url("${backgrounds[index]}")`;
    scene.classList.add("active");
}

function changeScene(direction){

    currentScene+=direction;

    if(currentScene<1) currentScene=1;
    if(currentScene>totalScenes) currentScene=totalScenes;

    showScene(currentScene);
}

showScene(1);

</script>
